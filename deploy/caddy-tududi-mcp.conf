# /opt/docker/caddy/conf/tududi-mcp.conf
# LAN + NetBird only. Adjust the NetBird range if yours isn't the default.
tududi-mcp.internal.anotherdrop.com {
	import protect

	@outside not remote_ip 192.168.0.0/16 100.64.0.0/10
	respond @outside 403

	reverse_proxy 192.168.1.YY:3000 {
		flush_interval -1   # don't buffer the streamable-HTTP/SSE responses
	}
}

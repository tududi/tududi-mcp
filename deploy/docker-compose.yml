services:
  tududi-mcp:
    build: https://github.com/<you>/tududi-mcp.git#http-transport
    image: tududi-mcp:local
    container_name: tududi-mcp
    restart: unless-stopped
    environment:
      TUDUDI_URL: http://192.168.1.XX:3002        # tududi, no trailing slash
      TUDUDI_API_TOKEN: ${TUDUDI_API_TOKEN}       # tududi Settings > API Tokens
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}           # what the Pebble app sends (openssl rand -hex 32)
      TUDUDI_TOOLS: add_to_inbox,list_inbox       # allowlist; unset = all 16 tools
    networks:
      macvlan_net:
        ipv4_address: 192.168.1.YY

networks:
  macvlan_net:
    external: true
